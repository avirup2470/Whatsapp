<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Authentic WhatsApp Mobile Doodle Background */
        .wa-chat-bg {
            background-color: #efeae2;
            background-image: 
                radial-gradient(rgba(180, 170, 156, 0.25) 1px, transparent 1px),
                radial-gradient(rgba(180, 170, 156, 0.25) 1px, #efeae2 1px);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
        }

        .dark .wa-chat-bg {
            background-color: #0b141a;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                radial-gradient(rgba(255, 255, 255, 0.04) 1px, #0b141a 1px);
        }

        /* Hide scrollbars cleanly for mobile feel */
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(134, 150, 160, 0.35);
            border-radius: 3px;
        }

        /* Bubble Tails */
        .tail-in::before {
            content: "";
            position: absolute;
            top: 0;
            left: -7px;
            width: 0;
            height: 0;
            border-top: 8px solid #ffffff;
            border-left: 8px solid transparent;
        }
        .dark .tail-in::before {
            border-top-color: #202c33;
        }

        .tail-out::before {
            content: "";
            position: absolute;
            top: 0;
            right: -7px;
            width: 0;
            height: 0;
            border-top: 8px solid #d9fdd3;
            border-right: 8px solid transparent;
        }
        .dark .tail-out::before {
            border-top-color: #005c4b;
        }

        /* Selected message highlight overlay */
        .msg-selected-row {
            background-color: rgba(0, 168, 132, 0.16) !important;
        }

        /* Enlarge emoji-only messages like native WhatsApp */
        .emoji-large {
            font-size: 2.15rem;
            line-height: 2.45rem;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        waTeal: '#008069',
                        waTealDark: '#1f2c34',
                        waGreen: '#00a884',
                        waOutgoing: '#d9fdd3',
                        waOutgoingDark: '#005c4b',
                        waIncoming: '#ffffff',
                        waIncomingDark: '#202c33'
                    }
                }
            }
        }
    </script>
</head>
<body class="h-[100dvh] w-screen bg-[#111b21] flex items-center justify-center select-none">

    <!-- Mobile App Shell (Full screen on mobile, centered mobile frame on larger screens) -->
    <div id="mobile-shell" class="w-full h-full sm:w-[412px] sm:h-[92dvh] sm:max-h-[860px] sm:rounded-[28px] sm:border-[6px] sm:border-[#2a3942] sm:shadow-2xl flex flex-col bg-[#efeae2] dark:bg-[#0b141a] overflow-hidden relative">

        <!-- Default WhatsApp Mobile Top Header -->
        <header id="default-header" class="h-[58px] bg-[#008069] dark:bg-[#1f2c34] text-white px-2 flex items-center justify-between flex-shrink-0 shadow-sm z-20">
            <div class="flex items-center gap-1 min-w-0">
                <!-- Back Arrow + Avatar -->
                <button id="switch-perspective-btn" title="Tap to switch sender perspective" class="flex items-center gap-1.5 py-1 px-1 rounded-full active:bg-white/10 transition">
                    <svg class="w-5 h-5 text-white flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    <div id="contact-avatar" class="w-9 h-9 rounded-full bg-emerald-100 text-[#008069] font-bold flex items-center justify-center text-base flex-shrink-0 shadow-inner">
                        V
                    </div>
                </button>

                <!-- Contact Name & Status -->
                <div id="contact-info-tap" class="min-w-0 ml-1 cursor-pointer">
                    <h1 id="contact-name" class="font-semibold text-[16px] leading-tight truncate">Viruss</h1>
                    <p id="contact-status" class="text-[11.5px] text-white/85 truncate leading-tight">online</p>
                </div>
            </div>

            <!-- Right Header Icons (Video, Call, Search/Menu) -->
            <div class="flex items-center gap-0.5">
                <button id="video-call-btn" class="p-2 rounded-full hover:bg-white/10 active:bg-white/20 transition" aria-label="Video call">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                    </svg>
                </button>
                <button id="voice-call-btn" class="p-2 rounded-full hover:bg-white/10 active:bg-white/20 transition" aria-label="Voice call">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
                    </svg>
                </button>
                <button id="menu-btn" class="p-2 rounded-full hover:bg-white/10 active:bg-white/20 transition" aria-label="More options">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Contextual Action Header (Appears when a message is selected: Reply, Star, Edit, Delete, Copy, Forward) -->
        <header id="selection-header" class="hidden h-[58px] bg-[#008069] dark:bg-[#1f2c34] text-white px-2 flex items-center justify-between flex-shrink-0 shadow-md z-30">
            <div class="flex items-center gap-3">
                <button id="close-selection-btn" class="p-2 rounded-full hover:bg-white/10 active:bg-white/20 transition" aria-label="Cancel selection">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </button>
                <span id="selected-count" class="font-semibold text-base">1</span>
            </div>

            <!-- Action Icons: Reply, Star, Edit, Delete, Copy, Forward -->
            <div class="flex items-center gap-0.5">
                <!-- Reply Icon -->
                <button id="action-reply-btn" title="Reply" class="p-2 rounded-full hover:bg-white/10 active:bg-white/20 transition" aria-label="Reply">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
                    </svg>
                </button>

                <!-- Star Icon -->
                <button id="action-star-btn" title="Star" class="p-2 rounded-full hover:bg-white/10 active:bg-white/20 transition" aria-label="Star">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
                    </svg>
                </button>

                <!-- Edit Icon -->
                <button id="action-edit-btn" title="Edit" class="p-2 rounded-full hover:bg-white/10 active:bg-white/20 transition" aria-label="Edit">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                    </svg>
                </button>

                <!-- Delete Icon -->
                <button id="action-delete-btn" title="Delete" class="p-2 rounded-full hover:bg-white/10 active:bg-white/20 transition" aria-label="Delete">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>

                <!-- Copy Icon -->
                <button id="action-copy-btn" title="Copy" class="p-2 rounded-full hover:bg-white/10 active:bg-white/20 transition" aria-label="Copy">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                </button>

                <!-- Forward Icon -->
                <button id="action-forward-btn" title="Forward" class="p-2 rounded-full hover:bg-white/10 active:bg-white/20 transition" aria-label="Forward">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 10H11a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Search Bar Header (Toggled from 3-dot menu) -->
        <header id="search-header" class="hidden h-[58px] bg-white dark:bg-[#1f2c34] px-2 flex items-center gap-2 flex-shrink-0 shadow-sm z-30 border-b border-gray-200 dark:border-gray-800">
            <button id="close-search-btn" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </button>
            <input id="search-input" type="text" placeholder="Search..." class="flex-1 bg-transparent text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none">
            <button id="clear-search-btn" class="hidden p-1.5 text-gray-400 hover:text-gray-600">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </header>

        <!-- 3-Dot Dropdown Menu -->
        <div id="dropdown-menu" class="hidden absolute top-14 right-2 w-48 bg-white dark:bg-[#233138] rounded-lg shadow-xl py-1.5 z-40 border border-gray-100 dark:border-gray-700 text-sm text-gray-800 dark:text-gray-100">
            <button id="menu-analyse" class="w-full text-left px-4 py-2.5 hover:bg-gray-100 dark:hover:bg-gray-700/60 flex items-center justify-between">
                <span>Analyse</span>
                <svg class="w-4 h-4 text-[#00a884]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
            </button>
            <button id="menu-search" class="w-full text-left px-4 py-2.5 hover:bg-gray-100 dark:hover:bg-gray-700/60">Search</button>
            <button id="menu-switch-user" class="w-full text-left px-4 py-2.5 hover:bg-gray-100 dark:hover:bg-gray-700/60">Switch sender side</button>
            <button id="menu-dark-mode" class="w-full text-left px-4 py-2.5 hover:bg-gray-100 dark:hover:bg-gray-700/60">Toggle dark mode</button>
            <button id="menu-clear-chat" class="w-full text-left px-4 py-2.5 hover:bg-gray-100 dark:hover:bg-gray-700/60 text-red-600 dark:text-red-400">Clear chat</button>
        </div>

        <!-- Chat Messages Scroll Area -->
        <main id="messages-container" class="flex-1 overflow-y-auto px-3 py-2.5 wa-chat-bg space-y-1">
            <!-- Messages dynamically rendered here -->
        </main>

        <!-- Floating Scroll to Bottom Button -->
        <button id="scroll-bottom-btn" class="hidden absolute bottom-[68px] right-3 w-9 h-9 rounded-full bg-white dark:bg-[#202c33] shadow-md border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-600 dark:text-gray-300 z-20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 13l-7 7-7-7m14-8l-7 7-7-7" />
            </svg>
        </button>

        <!-- Reply / Edit Preview Banner (Above Input Box) -->
        <div id="composer-context-bar" class="hidden bg-white dark:bg-[#1f2c34] px-3 pt-2 pb-1 border-t border-gray-200 dark:border-gray-800 z-20">
            <div class="flex items-center justify-between bg-[#f0f2f5] dark:bg-[#162026] rounded-lg px-3 py-1.5 border-l-4 border-[#00a884]">
                <div class="min-w-0 pr-2">
                    <div id="context-bar-title" class="text-xs font-semibold text-[#008069] dark:text-[#00a884]">Replying to Viruss</div>
                    <div id="context-bar-text" class="text-xs text-gray-600 dark:text-gray-300 truncate">Message preview</div>
                </div>
                <button id="cancel-context-btn" class="p-1 text-gray-500 hover:text-gray-700 dark:text-gray-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Bottom WhatsApp Mobile Input Bar -->
        <footer class="px-2 py-1.5 wa-chat-bg flex items-end gap-1.5 flex-shrink-0 z-20">
            <!-- Rounded White Message Pill -->
            <div class="flex-1 bg-white dark:bg-[#202c33] rounded-3xl px-2.5 py-1.5 flex items-center gap-1.5 shadow-sm">
                <!-- Emoji Icon -->
                <button id="emoji-btn" type="button" class="p-1 text-gray-500 dark:text-gray-400 hover:text-gray-700 flex-shrink-0" aria-label="Emoji">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </button>

                <!-- Text Input -->
                <input id="message-input" type="text" autocomplete="off" placeholder="Message" class="w-full bg-transparent text-[15px] text-gray-900 dark:text-gray-100 placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none py-1">

                <!-- Attachment Paperclip Icon -->
                <button id="attach-btn" type="button" class="p-1 text-gray-500 dark:text-gray-400 hover:text-gray-700 flex-shrink-0 -rotate-45" aria-label="Attach">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                    </svg>
                </button>

                <!-- Camera Icon (Hidden when typing) -->
                <button id="camera-btn" type="button" class="p-1 text-gray-500 dark:text-gray-400 hover:text-gray-700 flex-shrink-0" aria-label="Camera">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>

            <!-- Circular Green Mic / Send Button -->
            <button id="send-or-mic-btn" type="button" class="w-11 h-11 rounded-full bg-[#00a884] active:bg-[#008f6f] text-white flex items-center justify-center shadow-md flex-shrink-0 transition" aria-label="Send">
                <!-- Mic Icon (shown when input is empty) -->
                <svg id="mic-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15a.998.998 0 00-.98-.85c-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
                </svg>
                <!-- Send Icon (shown when typing or editing) -->
                <svg id="send-icon" class="w-5 h-5 translate-x-0.5 hidden" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </footer>

        <!-- Delete Confirmation Bottom Modal (WhatsApp Style) -->
        <div id="delete-modal" class="hidden absolute inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-4">
            <div class="bg-white dark:bg-[#233138] w-full max-w-xs rounded-2xl p-5 shadow-2xl space-y-4">
                <p class="text-sm text-gray-700 dark:text-gray-200">Delete message?</p>
                <div class="flex flex-col items-end gap-2 text-sm font-semibold text-[#008069] dark:text-[#00a884]">
                    <button id="delete-for-everyone-btn" class="py-1.5 px-3 rounded hover:bg-gray-100 dark:hover:bg-gray-700/50">Delete for everyone</button>
                    <button id="delete-for-me-btn" class="py-1.5 px-3 rounded hover:bg-gray-100 dark:hover:bg-gray-700/50">Delete for me</button>
                    <button id="cancel-delete-btn" class="py-1.5 px-3 rounded hover:bg-gray-100 dark:hover:bg-gray-700/50 text-gray-500 dark:text-gray-400">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Chat Analytics Full-Screen Mobile Drawer -->
        <div id="analytics-modal" class="hidden absolute inset-0 bg-[#efeae2] dark:bg-[#0b141a] z-50 flex flex-col">
            <!-- Analytics Header -->
            <header class="h-[58px] bg-[#008069] dark:bg-[#1f2c34] text-white px-2 flex items-center gap-2 flex-shrink-0 shadow-sm">
                <button id="close-analytics-btn" class="p-2 rounded-full hover:bg-white/10 active:bg-white/20 transition" aria-label="Back to chat">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </button>
                <div>
                    <h2 class="font-semibold text-[16px] leading-tight">Chat Analysis</h2>
                    <p id="analytics-subtitle" class="text-[11px] text-white/80 leading-tight">Messages over months</p>
                </div>
            </header>

            <!-- Scrollable Analytics Content -->
            <div id="analytics-content" class="flex-1 overflow-y-auto p-3.5 space-y-3.5">
                <!-- Summary Cards: Total, Avirup, Viruss -->
                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-white dark:bg-[#202c33] rounded-xl p-3 shadow-sm border border-gray-100 dark:border-gray-800 text-center">
                        <div class="text-[11px] text-gray-500 dark:text-[#8696a0] font-medium">Total</div>
                        <div id="stat-total" class="text-xl font-bold text-gray-900 dark:text-white mt-0.5">0</div>
                        <div class="text-[10px] text-[#00a884] font-medium mt-0.5">100%</div>
                    </div>
                    <div class="bg-white dark:bg-[#202c33] rounded-xl p-3 shadow-sm border border-gray-100 dark:border-gray-800 text-center">
                        <div id="stat-user1-label" class="text-[11px] text-gray-500 dark:text-[#8696a0] font-medium truncate">avirup</div>
                        <div id="stat-user1-count" class="text-xl font-bold text-[#00a884] mt-0.5">0</div>
                        <div id="stat-user1-pct" class="text-[10px] text-gray-500 dark:text-[#8696a0] mt-0.5">0%</div>
                    </div>
                    <div class="bg-white dark:bg-[#202c33] rounded-xl p-3 shadow-sm border border-gray-100 dark:border-gray-800 text-center">
                        <div id="stat-user2-label" class="text-[11px] text-gray-500 dark:text-[#8696a0] font-medium truncate">Viruss</div>
                        <div id="stat-user2-count" class="text-xl font-bold text-[#53bdeb] mt-0.5">0</div>

        /**
         * Parses WhatsApp export lines into structured message objects
         */
        function parseWhatsAppText(raw) {
            const lines = raw.split(/\r?\n/);
            const parsed = [];
            const msgRegex = /^(\d{1,2}\/\d{1,2}\/\d{2,4}),\s+(\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM|am|pm)?)\s+-\s+([^:]+):\s*(.*)$/;
            const sysRegex = /^(\d{1,2}\/\d{1,2}\/\d{2,4}),\s+(\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM|am|pm)?)\s+-\s+(.*)$/;

            let current = null;
            let idCounter = 1;

            for (const line of lines) {
                if (!line.trim() && !current) continue;
                const match = line.match(msgRegex);
                if (match) {
                    if (current) parsed.push(current);
                    const text = match[4];
                    const isDeleted = text.trim() === 'You deleted this message' || text.trim() === 'This message was deleted';
                    current = {
                        id: idCounter++,
                        date: match[1].trim(),
                        time: match[2].trim(),
                        sender: match[3].trim(),
                        text: text,
                        isSystem: false,
                        edited: false,
                        starred: false,
                        deleted: isDeleted,
                        replyTo: null
                    };
                } else {
                    const sysMatch = line.match(sysRegex);
                    if (sysMatch && !current) {
                        parsed.push({
                            id: idCounter++,
                            date: sysMatch[1].trim(),
                            time: sysMatch[2].trim(),
                            sender: 'System',
                            text: sysMatch[3],
                            isSystem: true
                        });
                    } else if (current) {
                        current.text += '\n' + line;
                    }
                }
            }
            if (current) parsed.push(current);
            return parsed;
        }

        function formatDateChip(dateStr) {
            const parts = dateStr.split('/');
            if (parts.length === 3) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                const m = parseInt(parts[0], 10) - 1;
                const d = parseInt(parts[1], 10);
                let y = parseInt(parts[2], 10);
                if (y < 100) y += 2000;
                if (months[m]) return `${months[m]} ${d}, ${y}`;
            }
            return dateStr;
        }

        function isOnlyEmojis(str) {
            const t = str.trim();
            if (!t) return false;
            return /^(?:\p{Emoji_Presentation}|\p{Extended_Pictographic}|\u200d|\ufe0f){1,5}$/u.test(t);
        }

        function formatMessageHTML(msg) {
            const trimmed = msg.text.trim();

            if (msg.deleted || trimmed === 'You deleted this message' || trimmed === 'This message was deleted') {
                return `
                    <span class="italic text-gray-500 dark:text-gray-400 inline-flex items-center gap-1.5 text-[13.5px]">
                        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

                        </svg>
                        ${msg.sender === currentUser ? 'You deleted this message' : 'This message was deleted'}
                    </span>
                `;
            }

            if (trimmed === '<Media omitted>') {
                return `
                    <div class="flex items-center gap-2.5 bg-black/5 dark:bg-white/5 px-2.5 py-2 rounded-lg my-0.5">
                        <div class="w-8 h-8 rounded-md bg-emerald-600/20 text-emerald-700 dark:text-emerald-300 flex items-center justify-center flex-shrink-0">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <span class="text-xs italic text-gray-600 dark:text-gray-300">Media omitted</span>
                    </div>
                `;
            }

            let safe = msg.text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            const urlPattern = /((?:https?:\/\/|www\.|[a-zA-Z0-9-]+\.blogspot\.com)[^\s<]+)/gi;
            safe = safe.replace(urlPattern, (url) => {
                const href = url.startsWith('http') ? url : `https://${url}`;
                return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="text-[#027eb5] dark:text-[#53bdeb] underline break-all">${url}</a>`;
            });

            if (searchQuery.trim()) {
                const esc = searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                safe = safe.replace(new RegExp(`(${esc})`, 'gi'), '<mark class="bg-yellow-300 text-black rounded px-0.5">$1</mark>');
            }

            return safe.replace(/\n/g, '<br>');
        }

        /**

        function renderMessages(scrollBottom = true) {
            messagesContainer.innerHTML = '';

            const list = searchQuery.trim()
                ? messages.filter(m => !m.deleted && m.text.toLowerCase().includes(searchQuery.toLowerCase()))

                    lastSender = null;
                    return;

                const isOutgoing = msg.sender === currentUser;
                const isFirst = msg.sender !== lastSender;
                lastSender = msg.sender;

                const isSelected = selectedMsgId === msg.id;
                const row = document.createElement('div');
                row.dataset.msgId = msg.id;
                row.className = `flex w-full px-1 py-0.5 rounded transition-colors cursor-pointer ${isOutgoing ? 'justify-end' : 'justify-start'} ${isFirst ? 'mt-1.5' : ''} ${isSelected ? 'msg-selected-row' : ''}`;

                const emojiOnly = !msg.deleted && isOnlyEmojis(msg.text);
                const bubbleColor = isOutgoing
                    ? 'bg-[#d9fdd3] dark:bg-[#005c4b] text-[#111b21] dark:text-[#e9edef]'
                    : 'bg-white dark:bg-[#202c33] text-[#111b21] dark:text-[#e9edef]';

                const tailClass = isFirst ? (isOutgoing ? 'tail-out rounded-tr-none' : 'tail-in rounded-tl-none') : '';

                const replyQuoteHTML = msg.replyTo ? `

                        <div class="font-semibold text-[#008069] dark:text-[#00a884] text-[11px]">${msg.replyTo.sender}</div>
                        <div class="text-gray-600 dark:text-gray-300 truncate text-[11.5px]">${msg.replyTo.text}</div>
                    </div>
                ` : '';

                const starIcon = msg.starred ? `<span class="text-[10px] mr-0.5">★</span>` : '';
                const editedLabel = msg.edited && !msg.deleted ? `<span class="italic mr-1">Edited</span>` : '';

                const ticks = isOutgoing && !msg.deleted ? `
                    <svg class="w-4 h-4 text-[#53bdeb] inline-block ml-0.5 -mb-0.5 flex-shrink-0" viewBox="0 0 16 15" fill="currentColor">
                        <path d="M15.01 3.316l-.478-.372a.365.365 0 0 0-.51.063L8.666 9.879a.32.32 0 0 1-.484.033l-.358-.325a.319.319 0 0 0-.484.032l-.378.483a.418.418 0 0 0 .036.541l1.32 1.266c.143.14.361.125.484-.033l6.272-8.048a.366.366 0 0 0-.064-.512zm-4.1 0l-.478-.372a.365.365 0 0 0-.51.063L4.566 9.879a.32.32 0 0 1-.484.033L1.891 7.769a.366.366 0 0 0-.515.006l-.423.433a.364.364 0 0 0 .006.514l3.258 3.185c.143.14.361.125.484-.033l6.272-8.048a.365.365 0 0 0-.063-.51z"/>
                    </svg>
                ` : '';

                row.innerHTML = `
                    <div class="relative max-w-[82%] px-2.5 py-1.5 rounded-lg shadow-[0_1px_0.5px_rgba(11,20,26,0.13)] ${bubbleColor} ${tailClass} break-words">
                        ${replyQuoteHTML}
                        <div class="${emojiOnly ? 'emoji-large py-0.5' : 'text-[14.2px] leading-[19px]'}">
                            ${formatMessageHTML(msg)}
                            <span class="inline-flex items-center float-right ml-2 mt-1.5 text-[10.5px] text-[#667781] dark:text-[#8696a0]">
                                ${starIcon}${editedLabel}${msg.time}${ticks}
                            </span>
                        </div>
                    </div>
                `;

                // Tap message to toggle selection toolbar (Edit, Delete, Reply, Copy, Forward, Star)
                row.addEventListener('click', (e) => {
                    if (e.target.tagName === 'A') return;
                    if (selectedMsgId === msg.id) {
                        clearSelection();
                    } else {

                frag.appendChild(row);

            messagesContainer.appendChild(frag);

        /**
         * Selection & Contextual Action Bar (Edit, Delete, Reply, Copy, Forward, Star)
         */
        function selectMessage(id) {
            selectedMsgId = id;
            const msg = messages.find(m => m.id === id);
            if (!msg) return;

            defaultHeader.classList.add('hidden');
            searchHeader.classList.add('hidden');
            dropdownMenu.classList.add('hidden');
            selectionHeader.classList.remove('hidden');

            // Only show Edit icon if message is not deleted and not media
            const canEdit = !msg.deleted && msg.text.trim() !== '<Media omitted>';
            document.getElementById('action-edit-btn').classList.toggle('hidden', !canEdit);

            renderMessages(false);
        }

        function clearSelection() {
            selectedMsgId = null;
            selectionHeader.classList.add('hidden');
            if (!searchHeader.classList.contains('hidden')) {
                // keep search header if open
            } else {
                defaultHeader.classList.remove('hidden');
            }
            renderMessages(false);
        }

        document.getElementById('close-selection-btn').addEventListener('click', clearSelection);

        // EDIT ACTION
        document.getElementById('action-edit-btn').addEventListener('click', () => {
            const msg = messages.find(m => m.id === selectedMsgId);

            editingMsgId = msg.id;

            clearSelection();

            document.getElementById('context-bar-title').textContent = 'Edit message';
            document.getElementById('context-bar-text').textContent = msg.text;
            composerContextBar.classList.remove('hidden');

            messageInput.value = msg.text;
            messageInput.focus();
            updateInputIcons();
        });

        // DELETE ACTION
        document.getElementById('action-delete-btn').addEventListener('click', () => {
            if (!selectedMsgId) return;
            const msg = messages.find(m => m.id === selectedMsgId);
            // Show "Delete for everyone" only if message isn't already deleted
            document.getElementById('delete-for-everyone-btn').classList.toggle('hidden', msg && msg.deleted);
            document.getElementById('delete-modal').classList.remove('hidden');

        document.getElementById('delete-for-everyone-btn').addEventListener('click', () => {

                msg.deleted = true;
                msg.text = 'You deleted this message';

            clearSelection();

        document.getElementById('delete-for-me-btn').addEventListener('click', () => {

            showToast('Message removed');

        document.getElementById('cancel-delete-btn').addEventListener('click', () => {
            document.getElementById('delete-modal').classList.add('hidden');
        });

        // REPLY ACTION
        document.getElementById('action-reply-btn').addEventListener('click', () => {
            const msg = messages.find(m => m.id === selectedMsgId);
            if (!msg) return;
            replyingToMsg = msg;
            editingMsgId = null;
            clearSelection();

            document.getElementById('context-bar-title').textContent = msg.sender === currentUser ? 'You' : msg.sender;
            document.getElementById('context-bar-text').textContent = msg.text;
            composerContextBar.classList.remove('hidden');
            messageInput.focus();

        // COPY ACTION
        document.getElementById('action-copy-btn').addEventListener('click', () => {
            const msg = messages.find(m => m.id === selectedMsgId);

                const temp = document.createElement('textarea');
                temp.value = msg.text;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                showToast('Message copied');

            clearSelection();

        // STAR ACTION
        document.getElementById('action-star-btn').addEventListener('click', () => {
            const msg = messages.find(m => m.id === selectedMsgId);
            if (msg) {
                msg.starred = !msg.starred;
                showToast(msg.starred ? 'Message starred' : 'Message unstarred');
            }
            clearSelection();

        // FORWARD ACTION
        document.getElementById('action-forward-btn').addEventListener('click', () => {
            const msg = messages.find(m => m.id === selectedMsgId);
            if (msg) {
                const now = new Date();
                const dateStr = `${now.getMonth() + 1}/${now.getDate()}/${String(now.getFullYear()).slice(-2)}`;
                const timeStr = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
                messages.push({
                    id: Date.now(),
                    date: dateStr,
                    time: timeStr,
                    sender: currentUser,
                    text: msg.text,
                    isSystem: false,
                    edited: false,
                    starred: false,
                    deleted: false,
                    replyTo: null

                clearSelection();
                renderMessages(true);
                showToast('Message forwarded');

        // Cancel Reply/Edit context bar
        document.getElementById('cancel-context-btn').addEventListener('click', () => {

            replyingToMsg = null;
            messageInput.value = '';
            composerContextBar.classList.add('hidden');
            updateInputIcons();

        /**
         * Input box & Send / Edit submission
         */
        function updateInputIcons() {
            const hasText = messageInput.value.trim().length > 0;
            micIcon.classList.toggle('hidden', hasText);
            sendIcon.classList.toggle('hidden', !hasText);
            cameraBtn.classList.toggle('hidden', hasText);
        }

        messageInput.addEventListener('input', updateInputIcons);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendOrEdit();
            }
        });

        document.getElementById('send-or-mic-btn').addEventListener('click', () => {
            if (messageInput.value.trim().length > 0) {
                handleSendOrEdit();

                showToast('Hold to record voice message');

        });

        function handleSendOrEdit() {
            const text = messageInput.value.trim();
            if (!text) return;

            if (editingMsgId !== null) {
                const msg = messages.find(m => m.id === editingMsgId);
                if (msg) {
                    msg.text = text;
                    msg.edited = true;
                }
                editingMsgId = null;
                composerContextBar.classList.add('hidden');
                messageInput.value = '';
                updateInputIcons();
                renderMessages(false);
                showToast('Message edited');
                return;
            }

            const now = new Date();
            const dateStr = `${now.getMonth() + 1}/${now.getDate()}/${String(now.getFullYear()).slice(-2)}`;
            const timeStr = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

            messages.push({
                id: Date.now(),
                date: dateStr,
                time: timeStr,
                sender: currentUser,
                text: text,
                isSystem: false,
                edited: false,
                starred: false,
                deleted: false,
                replyTo: replyingToMsg ? { sender: replyingToMsg.sender, text: replyingToMsg.text } : null
            });

            replyingToMsg = null;
            composerContextBar.classList.add('hidden');
            messageInput.value = '';
            updateInputIcons();
            renderMessages(true);
        }

        // Quick emoji insertion
        document.getElementById('emoji-btn').addEventListener('click', () => {
            messageInput.value += '🤣';
            messageInput.focus();
            updateInputIcons();
        });

        // Switch sender perspective (avirup <-> Viruss)
        function switchPerspective() {
            if (participants.length < 2) return;
            const idx = participants.indexOf(currentUser);
            currentUser = participants[(idx + 1) % participants.length];
            updateHeaderContact();
            renderMessages(false);
            showToast(`Viewing as ${currentUser}`);
        }

        document.getElementById('switch-perspective-btn').addEventListener('click', switchPerspective);
        document.getElementById('menu-switch-user').addEventListener('click', () => {
            dropdownMenu.classList.add('hidden');
            switchPerspective();
        });

        // 3-Dot Menu & Search
        document.getElementById('menu-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!dropdownMenu.contains(e.target)) {
                dropdownMenu.classList.add('hidden');
            }
        });

        document.getElementById('menu-search').addEventListener('click', () => {
            dropdownMenu.classList.add('hidden');
            defaultHeader.classList.add('hidden');
            searchHeader.classList.remove('hidden');
            document.getElementById('search-input').focus();
        });

        document.getElementById('close-search-btn').addEventListener('click', () => {
            searchQuery = '';
            document.getElementById('search-input').value = '';
            document.getElementById('clear-search-btn').classList.add('hidden');
            searchHeader.classList.add('hidden');
            defaultHeader.classList.remove('hidden');
            renderMessages(true);
        });

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            document.getElementById('clear-search-btn').classList.toggle('hidden', !searchQuery);
            renderMessages(false);
        });

        document.getElementById('clear-search-btn').addEventListener('click', () => {
            searchQuery = '';
            document.getElementById('search-input').value = '';
            document.getElementById('clear-search-btn').classList.add('hidden');
            renderMessages(true);
        });

        document.getElementById('menu-dark-mode').addEventListener('click', () => {
            dropdownMenu.classList.add('hidden');
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            showToast(isDark ? 'Dark mode on' : 'Light mode on');
        });

        // Analyse Menu Option & Graph Generation
        const analyticsModal = document.getElementById('analytics-modal');
        document.getElementById('menu-analyse').addEventListener('click', () => {
            dropdownMenu.classList.add('hidden');
            renderAnalytics();
            analyticsModal.classList.remove('hidden');
        });

        document.getElementById('close-analytics-btn').addEventListener('click', () => {
            analyticsModal.classList.add('hidden');
        });

        /**
         * Aggregates messages by Month/Year for Total, avirup, and Viruss
         * and renders both an interactive SVG trend chart and detailed bar graphs.
         */
        function renderAnalytics() {
            const validMsgs = messages.filter(m => !m.isSystem);
            const u1Name = participants.find(p => p.toLowerCase() === 'avirup') || participants[0] || 'avirup';
            const u2Name = participants.find(p => p.toLowerCase() === 'viruss') || participants.find(p => p !== u1Name) || 'Viruss';

            let totalCount = 0;
            let u1Total = 0;
            let u2Total = 0;

            const monthMap = new Map();
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

            validMsgs.forEach(msg => {
                totalCount++;
                const isU1 = msg.sender.toLowerCase() === u1Name.toLowerCase();
                const isU2 = msg.sender.toLowerCase() === u2Name.toLowerCase();
                if (isU1) u1Total++;
                else if (isU2) u2Total++;

                const parts = msg.date.split('/');
                let sortKey = msg.date;
                let label = msg.date;

                if (parts.length === 3) {
                    const m = parseInt(parts[0], 10);
                    let y = parseInt(parts[2], 10);
                    if (y < 100) y += 2000;
                    sortKey = `${y}-${String(m).padStart(2, '0')}`;
                    label = `${monthNames[m - 1] || m} '${String(y).slice(-2)}`;
                }

                if (!monthMap.has(sortKey)) {
                    monthMap.set(sortKey, { sortKey, label, total: 0, u1: 0, u2: 0 });
                }
                const entry = monthMap.get(sortKey);
                entry.total++;
                if (isU1) entry.u1++;
                else if (isU2) entry.u2++;
            });

            const monthlyData = Array.from(monthMap.values()).sort((a, b) => a.sortKey.localeCompare(b.sortKey));

            // Populate Summary Cards
            document.getElementById('stat-total').textContent = totalCount.toLocaleString();
            document.getElementById('stat-user1-label').textContent = u1Name;
            document.getElementById('stat-user1-count').textContent = u1Total.toLocaleString();
            document.getElementById('stat-user2-label').textContent = u2Name;
            document.getElementById('stat-user2-count').textContent = u2Total.toLocaleString();

            document.getElementById('legend-user1').textContent = u1Name;
            document.getElementById('legend-user2').textContent = u2Name;

            const u1Pct = totalCount > 0 ? Math.round((u1Total / totalCount) * 100) : 0;
            const u2Pct = totalCount > 0 ? Math.max(0, 100 - u1Pct) : 0;

            document.getElementById('stat-user1-pct').textContent = `${u1Pct}%`;
            document.getElementById('stat-user2-pct').textContent = `${u2Pct}%`;
            document.getElementById('share-bar-user1').style.width = `${u1Pct}%`;
            document.getElementById('share-bar-user2').style.width = `${u2Pct}%`;
            document.getElementById('analytics-subtitle').textContent = `${monthlyData.length} month${monthlyData.length === 1 ? '' : 's'} • ${totalCount.toLocaleString()} messages`;

            // Render SVG Multi-Line Graph (Total, avirup, Viruss over Months)
            const svgContainer = document.getElementById('monthly-svg-container');
            if (monthlyData.length === 0) {
                svgContainer.innerHTML = `<p class="text-xs text-center text-gray-500 py-6">No messages available to analyse.</p>`;
                document.getElementById('monthly-bars-list').innerHTML = '';
                return;
            }

            const maxVal = Math.max(...monthlyData.map(d => d.total), 1);
            const width = Math.max(320, monthlyData.length * 64);
            const height = 165;
            const padLeft = 28;
            const padRight = 18;
            const padTop = 20;
            const padBottom = 28;
            const chartW = width - padLeft - padRight;
            const chartH = height - padTop - padBottom;

            const getX = (i) => monthlyData.length === 1
                ? padLeft + chartW / 2
                : padLeft + (i / (monthlyData.length - 1)) * chartW;
            const getY = (val) => padTop + chartH - (val / maxVal) * chartH;

            const totalPoints = monthlyData.map((d, i) => `${getX(i)},${getY(d.total)}`).join(' ');
            const u1Points = monthlyData.map((d, i) => `${getX(i)},${getY(d.u1)}`).join(' ');
            const u2Points = monthlyData.map((d, i) => `${getX(i)},${getY(d.u2)}`).join(' ');

            const areaPoints = monthlyData.length > 1
                ? `${getX(0)},${padTop + chartH} ${totalPoints} ${getX(monthlyData.length - 1)},${padTop + chartH}`
                : '';

            let dotsAndLabels = '';
            monthlyData.forEach((d, i) => {
                const x = getX(i);
                const yTot = getY(d.total);
                const y1 = getY(d.u1);
                const y2 = getY(d.u2);

                dotsAndLabels += `
                    <line x1="${x}" y1="${padTop}" x2="${x}" y2="${padTop + chartH}" stroke="rgba(134,150,160,0.15)" stroke-dasharray="3 3" />
                    <circle cx="${x}" cy="${yTot}" r="3.5" fill="#f59e0b" />
                    <text x="${x}" y="${yTot - 6}" text-anchor="middle" fill="#f59e0b" font-size="9.5" font-weight="600">${d.total}</text>
                    <circle cx="${x}" cy="${y1}" r="3" fill="#00a884" />
                    <circle cx="${x}" cy="${y2}" r="3" fill="#53bdeb" />
                    <text x="${x}" y="${height - 8}" text-anchor="middle" fill="#8696a0" font-size="10">${d.label}</text>
                `;
            });

            svgContainer.innerHTML = `
                <div class="flex items-center gap-3 text-[10.5px] mb-1.5 text-gray-600 dark:text-gray-300">
                    <span class="flex items-center gap-1"><span class="w-2.5 h-0.5 bg-[#f59e0b] inline-block"></span>Total</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-0.5 bg-[#00a884] inline-block"></span>${u1Name}</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-0.5 bg-[#53bdeb] inline-block"></span>${u2Name}</span>
                </div>
                <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" class="overflow-visible">
                    <defs>
                        <linearGradient id="totalGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22" />
                            <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
                        </linearGradient>
                    </defs>
                    <line x1="${padLeft}" y1="${padTop + chartH}" x2="${width - padRight}" y2="${padTop + chartH}" stroke="rgba(134,150,160,0.3)" />
                    ${areaPoints ? `<polygon points="${areaPoints}" fill="url(#totalGrad)" />` : ''}
                    ${monthlyData.length > 1 ? `
                        <polyline fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" points="${totalPoints}" />
                        <polyline fill="none" stroke="#00a884" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${u1Points}" />
                        <polyline fill="none" stroke="#53bdeb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${u2Points}" />
                    ` : ''}
                    ${dotsAndLabels}
                </svg>
            `;

            // Render Monthly Horizontal Bar Graph Cards
            const barsList = document.getElementById('monthly-bars-list');
            barsList.innerHTML = monthlyData.map(d => {
                const totW = Math.max(4, Math.round((d.total / maxVal) * 100));
                const u1W = Math.max(d.u1 > 0 ? 3 : 0, Math.round((d.u1 / maxVal) * 100));
                const u2W = Math.max(d.u2 > 0 ? 3 : 0, Math.round((d.u2 / maxVal) * 100));

                return `
                    <div class="space-y-1">
                        <div class="flex items-center justify-between text-xs">
                            <span class="font-semibold text-gray-800 dark:text-gray-200">${d.label}</span>
                            <span class="text-[11px] font-medium text-[#f59e0b]">Total: ${d.total}</span>
                        </div>
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="w-12 text-[10px] text-gray-500 dark:text-[#8696a0] truncate">Total</span>
                                <div class="flex-1 h-2 bg-gray-100 dark:bg-[#111b21] rounded-full overflow-hidden">
                                    <div class="h-full bg-[#f59e0b] rounded-full" style="width: ${totW}%"></div>
                                </div>
                                <span class="w-8 text-right text-[10px] font-medium text-gray-700 dark:text-gray-300">${d.total}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="w-12 text-[10px] text-gray-500 dark:text-[#8696a0] truncate">${u1Name}</span>
                                <div class="flex-1 h-2 bg-gray-100 dark:bg-[#111b21] rounded-full overflow-hidden">
                                    <div class="h-full bg-[#00a884] rounded-full" style="width: ${u1W}%"></div>
                                </div>
                                <span class="w-8 text-right text-[10px] font-medium text-gray-700 dark:text-gray-300">${d.u1}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="w-12 text-[10px] text-gray-500 dark:text-[#8696a0] truncate">${u2Name}</span>
                                <div class="flex-1 h-2 bg-gray-100 dark:bg-[#111b21] rounded-full overflow-hidden">
                                    <div class="h-full bg-[#53bdeb] rounded-full" style="width: ${u2W}%"></div>
                                </div>
                                <span class="w-8 text-right text-[10px] font-medium text-gray-700 dark:text-gray-300">${d.u2}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('menu-clear-chat').addEventListener('click', () => {
            dropdownMenu.classList.add('hidden');
            messages = [];
            renderMessages(true);
            showToast('Chat cleared');
        });

        // Scroll-to-bottom floating button
        const scrollBottomBtn = document.getElementById('scroll-bottom-btn');
        messagesContainer.addEventListener('scroll', () => {
            const dist = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight;
            scrollBottomBtn.classList.toggle('hidden', dist < 200);
        });
        scrollBottomBtn.addEventListener('click', () => {
            messagesContainer.scrollTo({ top: messagesContainer.scrollHeight, behavior: 'smooth' });
        });

        /**
         * Silently fetches chat.txt from https://avirup2470.github.io/Whatsapp/chat.txt
         * without showing any status banners. Uses fallback silently if unreachable.
         */
        async function initChat() {
            let rawText = FALLBACK_CHAT_TEXT;
            try {
                const res = await fetch(REMOTE_CHAT_URL, { cache: 'no-store' });
                if (res.ok) {
                    const fetched = await res.text();
                    if (fetched && fetched.trim().length > 0) {
                        rawText = fetched;
                    }
                }
            } catch (_) {
                // Silent fallback to built-in dummy chat
            }

            messages = parseWhatsAppText(rawText);
            const senders = [...new Set(messages.filter(m => !m.isSystem).map(m => m.sender))];
            participants = senders.length > 0 ? senders : ['avirup', 'Viruss'];
            currentUser = participants.find(p => p.toLowerCase() === 'avirup') || participants[0];

            updateHeaderContact();
            renderMessages(true);
        }

        window.addEventListener('DOMContentLoaded', initChat);
    </script>
</body>
</html>
